<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-2">
    <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Amazon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown me-2">
                        <select class="form-select" name="brand" id='brand' aria-label="Default select example"
                            onchange="filterShoes(event)">
                            <option selected value="">Brand</option>
                            <option value="Nike">Nike</option>
                            <option value="Adidas">Adidas</option>
                            <option value="New Balance">New Balance</option>
                            <option value="Louis Vuitton">Louis Vuitton</option>
                        </select>
                    </li>

                    <li class="nav-item dropdown me-2">
                        <select class="form-select" name="color" id="color" aria-label="Default select example"
                            onchange="filterShoes(event)">
                            <option selected value="">Color</option>
                            <option value="Black">Black</option>
                            <option value="Blue">Blue</option>
                            <option value="White">White</option>
                            <option value="Purple">Purple</option>
                            <option value="Yellow">Yellow</option>
                            <option value="Green">Green</option>
                            <option value="Orange">Orange</option>
                            <option value="Grey">Grey</option>
                            <option value="Brown">Brown</option>
                            <option value="Pink">Pink</option>
                        </select>
                    </li>

                    <li class="nav-item dropdown me-2">
                        <select class="form-select" name="size" id="size" aria-label="Default select example"
                            onchange="filterShoes(event)">
                            <option selected value="">Size</option>
                            <option value="Small">Small</option>
                            <option value="Medium">Medium</option>
                            <option value="Large">Large</option>
                        </select>
                    </li>

                    <li class="nav-item dropdown me-2">
                        <select class="form-select" name="price" id="price" aria-label="Default select example"
                            onchange="filterShoes(event)">
                            <option selected value="">Price</option>
                            <option value="$0-$100">$0-$100</option>
                            <option value="$100-$200">$100-$200</option>
                            <option value="$200-$300">$200-$300</option>
                            <option value="$300-$400">$300-$400</option>
                            <option value="$400-$500">$400-$500</option>
                            <option value="$500-$600">$500-$600</option>
                        </select>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container mt-5">
        <div class="row gy-4 gx-3" id="show-rows"></div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>

</html>
